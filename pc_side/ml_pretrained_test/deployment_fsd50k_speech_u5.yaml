# Copy this file into stm32ai-modelzoo-services/audio_event_detection/configs/.
# Set STM32_MODEL_PATH to the verified TFLite model before running Hydra.

general:
  project_name: fsd50k_speech_u5_smoke
  logs_dir: logs
  saved_models_dir: saved_models
  global_seed: 120
  gpu_memory_limit: 5
  display_figures: False

operation_mode: deployment

model:
  model_path: ${oc.env:STM32_MODEL_PATH}

dataset:
  dataset_name: fsd50k
  class_names: ['Speech', 'Gunshot_and_gunfire', 'Crying_and_sobbing', 'Knock', 'Glass']
  file_extension: '.wav'
  multi_label: False
  use_garbage_class: True
  n_samples_per_garbage_class: 2
  expand_last_dim: True
  seed: 120
  to_cache: True
  shuffle: True

preprocessing:
  min_length: 1
  max_length: 10
  target_rate: 16000
  top_db: 60
  frame_length: 3200
  hop_length: 3200
  trim_last_second: False
  lengthen: 'after'

feature_extraction:
  patch_length: 96
  n_mels: 64
  overlap: 0.25
  n_fft: 512
  hop_length: 160
  window_length: 400
  window: hann
  center: False
  pad_mode: constant
  power: 1.0
  fmin: 125
  fmax: 7500
  norm: None
  htk: True
  to_db: False
  include_last_patch: False

tools:
  stedgeai:
    optimization: balanced
    on_cloud: True
    path_to_stedgeai: C:/ST/STEdgeAI/<x.y>/Utilities/windows/stedgeai.exe
  path_to_cubeIDE: C:/ST/STM32CubeIDE_1.17.0/STM32CubeIDE/stm32cubeide.exe

deployment:
  c_project_path: ../application_code/sensing/STM32U5
  IDE: GCC
  verbosity: 1
  hardware_setup:
    serie: STM32U5
    board: B-U585I-IOT02A
  unknown_class_threshold: 0.0
  build_conf: debug

mlflow:
  uri: ./tf/src/experiments_outputs/mlruns

hydra:
  run:
    dir: ./tf/src/experiments_outputs/${now:%Y_%m_%d_%H_%M_%S}
